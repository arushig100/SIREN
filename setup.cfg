[metadata]
name = siren-scene-reasoning
version = 1.0.0
description = Entity-based disaster assessment and validated scene programs
license = MIT

[options]
package_dir =
    = src
packages = find_namespace:
python_requires = >=3.10,<3.15
install_requires =
    numpy>=1.26,<2.4
    shapely>=2,<3

[options.packages.find]
where = src

[options.extras_require]
language =
    anthropic==0.84.0
    openai==2.21.0
test =
    pytest>=7
notebook =
    jupyterlab>=4,<5
    matplotlib>=3.7
